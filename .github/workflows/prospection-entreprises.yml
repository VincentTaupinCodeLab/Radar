name: Prospection Radar Entreprises

# Génère les emails personnalisés (email 1 + 2 relances) de la prospection Radar Entreprises,
# avec les créations BODACC des 7 derniers jours dans le département de chaque prospect :
# - dès que la liste de prospects est complétée (ajouts du passage du matin) ;
# - chaque lundi, pour des chiffres frais.
on:
  push:
    branches: [main]
    paths: [prospection/prospects.csv]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restauration de la base (cache)
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: BODACC (8 derniers jours)
        run: python pipeline.py --days 8

      - name: Séquence d'emails
        working-directory: prospection
        run: python sequence.py

      - name: Sauvegarde de la base (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}

      - name: Enregistrement
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add prospection/brouillons.csv prospection/apercu.html
          if ! git diff --cached --quiet; then
            git commit -m "prospection entreprises : séquence du $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
