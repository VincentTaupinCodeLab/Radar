name: Mise en place Stripe

# Lancement manuel, une fois la clé secrète de production enregistrée dans
# Settings > Secrets and variables > Actions > STRIPE_SECRET_KEY.
# Crée (sans doublon) les offres, les liens de paiement et le portail client,
# publie site/stripe.json puis met le site en ligne : les boutons
# « S'abonner directement » et « Gérer mon abonnement » apparaissent.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérification de la clé
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          case "$STRIPE_SECRET_KEY" in
            sk_live_*|rk_live_*) echo "Clé de production détectée." ;;
            "") echo "::error::Secret STRIPE_SECRET_KEY absent."; exit 1 ;;
            *) echo "::error::La clé enregistrée n'est pas une clé de production (sk_live_...)."; exit 1 ;;
          esac

      - name: Offres, liens de paiement et portail client
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python billing.py setup

      - name: Enregistrement de stripe.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add site/stripe.json
          if ! git diff --cached --quiet; then
            git commit -m "site: liens de paiement Stripe (production)"
            git pull --rebase origin main
            git push
          fi

      - name: Mise en ligne sur Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: e3b00484-2068-48ed-b60e-08fcffb9acf9
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Secret NETLIFY_TOKEN absent : liens créés et enregistrés, mais site non mis en ligne."
            exit 1
          fi
          npx -y netlify-cli@latest deploy --prod --dir site --site "$NETLIFY_SITE_ID" \
            --message "Paiements Stripe en production"
