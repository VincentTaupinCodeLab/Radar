name: Radar quotidien

on:
  schedule:
    # 05:12 UTC = 07:12 à Paris l'été, 06:12 l'hiver. Du mardi au samedi
    # (le BODACC paraît en semaine ; le run du mardi rattrape le lundi).
    - cron: "12 5 * * 2-6"
  workflow_dispatch:
    inputs:
      test_to:
        description: "Envoyer seulement un email de test à cette adresse (laisser vide pour un passage normal)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restauration de la base (cache)
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: BODACC (créations + cessions, toute la France)
        run: python pipeline.py --days 3

      - name: DECP (marchés attribués, 30 derniers jours, toute la France)
        if: ${{ !inputs.test_to }}
        run: python decp.py --days 30 --region all

      - name: Envoi des alertes
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: Radar Entreprises
          TEST_TO: ${{ inputs.test_to }}
        run: python sender.py

      - name: Sauvegarde de la base (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}

      - name: Sauvegarde de l'état d'envoi
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "data: run $(date -u +%F)"
          git push
