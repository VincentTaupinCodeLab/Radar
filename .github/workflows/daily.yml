name: Radar quotidien

on:
  schedule:
    # 05:12 UTC = 07:12 à Paris l'été, 06:12 l'hiver. Du mardi au samedi
    # (le BODACC paraît en semaine ; le run du mardi rattrape le lundi).
    - cron: "12 5 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: BODACC (créations + cessions, Nouvelle-Aquitaine)
        run: python pipeline.py --days 3 --region 75

      - name: DECP (marchés attribués, 30 derniers jours)
        run: python decp.py --days 30 --region 75

      - name: Envoi des alertes
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: Radar Entreprises
        run: python sender.py

      - name: Sauvegarde de la base et de l'état
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar.db state/ || true
          git diff --cached --quiet || git commit -m "data: run $(date -u +%F)"
          git push
