<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Désinscription — Radar Entreprises</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='28' height='15' rx='4' transform='rotate(-6 16 16)' fill='%23FFE34A'/%3E%3Cpath d='M9 22V10h6.2c2.6 0 4.3 1.5 4.3 3.8 0 1.8-1 3-2.7 3.5L20 22h-3.3l-2.8-4.4H12V22z M12 15.2h3c1 0 1.6-.6 1.6-1.4S16 12.4 15 12.4h-3z' fill='%231D2125'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap"><a class="logo" href="/" aria-label="Radar Entreprises, accueil">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="28" height="15" rx="4" transform="rotate(-6 16 16)" fill="#FFE34A"/><path d="M9 22V10h6.2c2.6 0 4.3 1.5 4.3 3.8 0 1.8-1 3-2.7 3.5L20 22h-3.3l-2.8-4.4H12V22z M12 15.2h3c1 0 1.6-.6 1.6-1.4S16 12.4 15 12.4h-3z" fill="#1D2125"/></svg>
      Radar Entreprises
    </a></div></header>
<main class="page"><section><div class="wrap narrow">
<h1 id="titre">Désinscription en cours…</h1>
<p id="msg" style="margin-top:20px">Un instant.</p>
<form name="liste-desinscription" method="POST" action="/liste/desinscription.html?ok=1" data-netlify="true" id="f" hidden style="margin-top:24px">
  <input type="hidden" name="form-name" value="liste-desinscription">
  <input type="hidden" name="inscription" id="inscription" value="">
  <button class="btn" type="submit">Me désinscrire</button>
</form>
</div></section></main>
<footer>
  <div class="wrap">
    <span>Radar Entreprises. Données BODACC et DECP, Licence Ouverte 2.0.</span>
    <nav aria-label="Liens utiles"><a href="mailto:contact@radar-entreprises.fr">contact@radar-entreprises.fr</a><a href="/departements/">Nouvelles entreprises par département</a><a href="/marches/departements/">Marchés publics par département</a><a href="/mentions-legales.html">Mentions légales et données personnelles</a><a href="/cgv.html">Conditions générales de vente</a></nav>
  </div>
</footer>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const id = q.get("id") || "";
  const titre = document.getElementById("titre"), msg = document.getElementById("msg"), f = document.getElementById("f");
  const fini = () => { titre.textContent = "Vous êtes désinscrit."; msg.textContent = "Vous ne recevrez plus la liste gratuite. Votre adresse est effacée de nos fichiers dans les heures qui suivent."; };
  if (q.get("ok")) return fini();
  if (!/^[0-9a-f]{12,40}$/i.test(id)) { titre.textContent = "Lien incomplet"; msg.innerHTML = 'Écrivez « stop » à <a href="mailto:contact@radar-entreprises.fr">contact@radar-entreprises.fr</a> : nous vous retirons de la liste.'; return; }
  document.getElementById("inscription").value = id;
  const body = new URLSearchParams({"form-name": "liste-desinscription", "inscription": id}).toString();
  fetch("/", {method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"}, body})
    .then(r => { if (!r.ok) throw 0; fini(); })
    .catch(() => { titre.textContent = "Confirmez la désinscription"; msg.textContent = "Cliquez sur le bouton pour ne plus recevoir la liste."; f.hidden = false; });
})();
</script>
<noscript><style>#f{display:block!important}</style></noscript>
</body></html>
